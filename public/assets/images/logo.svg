  </g>

  <!-- Factory icon (top-left, white on teal) -->
  <g transform="translate(14,66)" clip-path="url(#circ)" fill="white" opacity="0.9">
    <rect x="1" y="9" width="16" height="11" rx="1"/>
    <rect x="3.5" y="4.5" width="2.8" height="5"/>
    <rect x="8.5" y="2" width="2.8" height="7"/>
    <path d="M4 4 Q3 2 4 0 Q5 1.5 4 4M9.5 2 Q8.5 0 9.5-1 Q10.5.5 9.5 2"
          stroke="white" stroke-width="0.6" fill="none" opacity="0.7"/>
  </g>

  <!-- Analytics chart (lower-left, white on navy) -->
  <g transform="translate(14,113)" clip-path="url(#circ)">
    <rect x="0" y="0" width="18" height="14" rx="2"
          fill="none" stroke="white" stroke-width="1" opacity="0.85"/>
    <rect x="2"    y="9"  width="2.5" height="3.5" rx="0.5" fill="white" opacity="0.85"/>
    <rect x="5.5"  y="6"  width="2.5" height="6.5" rx="0.5" fill="white" opacity="0.85"/>
    <rect x="9"    y="4"  width="2.5" height="8.5" rx="0.5" fill="white" opacity="0.85"/>
    <rect x="12.5" y="7"  width="2.5" height="5.5" rx="0.5" fill="white" opacity="0.85"/>
  </g>

  <!-- Delivery truck (white band, navy icon) -->
  <g transform="translate(68,77)" clip-path="url(#circ)">
    <rect x="0" y="3" width="20" height="12" rx="2" fill="#1B3358" opacity="0.9"/>
    <polygon points="20,3 20,13 28,13 28,8 24,3" fill="#1B3358" opacity="0.9"/>
    <line x1="20" y1="7" x2="28" y2="7" stroke="white" stroke-width="0.8"/>
    <circle cx="5"  cy="17" r="3"   fill="none" stroke="#1B3358" stroke-width="1.6"/>
    <circle cx="5"  cy="17" r="1.2" fill="#1B3358"/>
    <circle cx="22" cy="17" r="3"   fill="none" stroke="#1B3358" stroke-width="1.6"/>
    <circle cx="22" cy="17" r="1.2" fill="#1B3358"/>
  </g>

  <!-- Factory top-right (on map, navy) -->
  <g transform="translate(142,38)" clip-path="url(#circ)" fill="#1B3358" opacity="0.85">
    <rect x="1" y="8" width="14" height="10" rx="1"/>
    <rect x="3" y="4" width="2.5" height="5"/>
    <rect x="7.5" y="2" width="2.5" height="6"/>
    <path d="M3.5 3 Q2.5 1 3.5-.5 Q4.5 1 3.5 3M8 2 Q7 0 8-1 Q9 .5 8 2"
