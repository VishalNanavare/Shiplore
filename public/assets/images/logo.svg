    <line x1="150" y1="45" x2="166" y2="42"/><line x1="95" y1="15" x2="62" y2="32"/>
    <line x1="62" y1="32" x2="50" y2="58"/><line x1="50" y1="58" x2="44" y2="85"/>
    <line x1="166" y1="42" x2="168" y2="70"/><line x1="44" y1="85" x2="44" y2="110"/>
    <line x1="168" y1="70" x2="165" y2="95"/>
  </g>
  <g clip-path="url(#circ)" fill="none" stroke="#9FB8CC" stroke-width="0.9" opacity="0.5">
    <circle cx="95" cy="15" r="3"/><circle cx="150" cy="45" r="3.2"/>
    <circle cx="166" cy="42" r="2.5"/><circle cx="50" cy="58" r="2.8"/>
    <circle cx="44" cy="85" r="2.5"/><circle cx="168" cy="70" r="2.5"/>
    <circle cx="44" cy="110" r="2.5"/><circle cx="165" cy="95" r="2.5"/>
  </g>
  <g clip-path="url(#circ)" font-family="sans-serif" font-size="5" fill="#7A9BB0" opacity="0.5">
    <text x="98" y="13">11</text><text x="170" y="40">14</text>
    <text x="37" y="84">41</text><text x="37" y="111">14</text>
  </g>

