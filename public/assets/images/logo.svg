  <!-- Network cluster (lower-left, white on orange) -->
  <g transform="translate(14,127)" clip-path="url(#circ)"
     stroke="white" stroke-width="0.9" fill="white" opacity="0.85">
    <circle cx="0"  cy="7"  r="3"/>
    <circle cx="11" cy="0"  r="3"/>
    <circle cx="11" cy="14" r="3"/>
    <circle cx="22" cy="7"  r="3"/>
    <line x1="3" y1="6"  x2="8"  y2="2"/>
    <line x1="3" y1="8"  x2="8"  y2="12"/>
    <line x1="14" y1="2"  x2="19" y2="5"/>
    <line x1="14" y1="12" x2="19" y2="9"/>
  </g>
</svg>
