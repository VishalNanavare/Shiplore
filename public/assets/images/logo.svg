    <circle cx="9"  cy="17" r="2.4" fill="white" opacity="0.9"/>
    <circle cx="20" cy="17" r="2.4" fill="white" opacity="0.9"/>
  </g>

  <!-- Store/shop (orange band, white icon) -->
  <g transform="translate(152,112)" clip-path="url(#circ)">
    <rect x="0" y="6" width="18" height="13" rx="1.5" fill="white" opacity="0.9"/>
    <path d="M-2 7 Q9 1 20 7" fill="none" stroke="white" stroke-width="1.6"
          stroke-linecap="round" opacity="0.9"/>
    <rect x="6"    y="10" width="6"   height="9"   fill="#C87828" rx="0.5"/>
    <rect x="2"    y="10" width="3.5" height="5.5" rx="0.5" fill="#C87828" opacity="0.85"/>
    <rect x="12.5" y="10" width="3.5" height="5.5" rx="0.5" fill="#C87828" opacity="0.85"/>
  </g>

  <!-- Search magnify (right side, white on navy) -->
  <g transform="translate(166,103)" clip-path="url(#circ)">
    <circle cx="6" cy="6" r="5.5" fill="none" stroke="white" stroke-width="1.6" opacity="0.85"/>
    <line x1="10.5" y1="10.5" x2="15" y2="15" stroke="white" stroke-width="1.8"
          stroke-linecap="round" opacity="0.85"/>
