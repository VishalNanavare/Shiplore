    <path d="M5 95 Q35 70 78 82 Q116 94 154 72 Q172 62 198 70 L198 78
             Q172 70 154 82 Q115 104 77 92 Q34 80 5 106Z" fill="white"/>
    <path d="M5 108 Q35 83 78 95 Q116 107 154 85 Q172 75 198 83 L198 102
