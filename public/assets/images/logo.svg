<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Shiplore">
  <defs>
    <clipPath id="circ"><circle cx="100" cy="100" r="97"/></clipPath>
  </defs>

  <!-- Outer white circle -->
  <circle cx="100" cy="100" r="99" fill="white"/>
  <circle cx="100" cy="100" r="98.5" fill="none" stroke="#D5DCE6" stroke-width="1.2"/>

  <!-- India map silhouette -->
  <g clip-path="url(#circ)">
    <path d="M76 14 Q87 10 100 13 Q113 14 126 22 Q140 30 145 43
             Q152 50 150 63 Q158 73 155 86 Q160 98 155 110
             Q156 122 148 133 Q142 145 133 154 Q124 165 115 173
             Q107 180 100 184 Q93 179 86 170 Q76 160 69 148
             Q60 136 55 122 Q47 110 49 97 Q43 85 48 72
             Q50 58 58 46 Q64 32 76 14Z"
          fill="#3B7A58" opacity="0.87"/>
    <path d="M145 43 Q153 36 162 38 Q170 40 172 50 Q174 60 167 67
             Q160 72 153 66 Q148 58 145 50Z"
          fill="#3B7A58" opacity="0.72"/>
    <path d="M85 75 Q102 80 118 74 Q114 96 100 102 Q86 97 83 82Z"
          fill="#4E9E72" opacity="0.55"/>
  </g>

  <!-- Network lines -->
  <g clip-path="url(#circ)" stroke="#9FB8CC" stroke-width="0.7" fill="none" opacity="0.4">
