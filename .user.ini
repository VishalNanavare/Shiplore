; PHP directives this application REQUIRES to run correctly and safely.
;
; Tracked on purpose. An untracked copy of this file was deleted by a deployment
; checkout and took the site down: CodeIgniter refuses to boot when
; zlib.output_compression is on (see app/Config/Events.php), so every request became a
; CRITICAL. Worse, display_errors reverted to the server default at the same moment,
; which publishes stack traces — and this platform's traces carry absolute server paths.
; A file the site cannot boot without must not be something git can silently remove.
;
; cPanel regenerates its own block in this file when you use MultiPHP INI Editor. That
; is fine; keep the directives below.
;
; NOTHING HERE MAY NAME A SERVER PATH OR ACCOUNT. The original carried
; error_log = "/home/<account>/logs/php.error.log", which published the hosting account
; name in a public repository. Omitting error_log lets PHP fall back to the server's own
; log, which is where cPanel looks anyway. HardeningConfigTest enforces this.

[PHP]

; MUST stay off. CodeIgniter buffers its own output; with zlib compression enabled it
; throws FrameworkException at pre_system and NO route resolves.
zlib.output_compression = Off

; MUST stay off in production. A stack trace here exposes absolute paths, and exception
; messages can carry connection details.
display_errors = Off
log_errors = On

; Bulk catalogue imports and media uploads. The platform carries ~1.8M product variants,
; and an import that exceeds these limits fails as a truncated POST with no error.
memory_limit = 5000M
post_max_size = 5000M
upload_max_filesize = 5000M
max_execution_time = 3000
max_input_time = 6000

; A product form with a large variant matrix posts more than the default 1000 inputs.
; Exceeding it silently DROPS the surplus fields rather than failing, so variants go
; missing with a success message.
max_input_vars = 10000

; Four hours. Long enough that a shop counter session does not expire mid-shift.
session.gc_maxlifetime = 14400
